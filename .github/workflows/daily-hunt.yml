name: Daily APT KQL Detections

on:
  schedule:
    # 13:17 UTC every day (offset from the top of the hour for reliability).
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate candidate KQL detections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python hunt.py

      - name: Commit updated playbook
        run: |
          git config user.name  "apt-hunt-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily APT candidate KQL detections: $(date -u +%Y-%m-%d)"
            git push
          fi
